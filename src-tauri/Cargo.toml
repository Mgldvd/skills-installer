[package]
name = "skills-installer"
version = "0.1.0"
description = "Skills Installer — a desktop app for discovering, configuring, and installing agent skills"
edition = "2021"
rust-version = "1.85"

[lib]
name = "skills_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "skills-installer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.5.61", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.4"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1.53.1", features = [
  "process",
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
  "io-util",
  "fs",
  "time",
] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[profile.release]
panic = "unwind"
