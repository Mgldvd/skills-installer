version: "3"

tasks:
  dev:
    desc: Start the Tauri development app (hot-reloading Vue frontend + Rust backend).
    deps: [frontend-deps]
    cmds:
      - "{{.TAURI_BIN}} dev"

  dev-design:
    desc: Start the frontend dev server and open the component style guide (design.html).
    deps: [frontend-deps]
    cmds:
      - npm run dev --prefix {{.FRONTEND_DIR}} -- --open /design.html
