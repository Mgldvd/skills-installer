---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev

version: "3"

output: interleaved

dotenv: [".env", "{{.ENV}}/.env.", "{{.HOME}}/.env"]

vars:
  FRONTEND_DIR: frontend
  TAURI_DIR: src-tauri
  TAURI_BIN: frontend/node_modules/.bin/tauri
  GENERATED_DIR: .generated
  DIST_DIR: .generated/dist
  TEST_DIR: .generated/smoke
  CLI_BIN: src-tauri/target/debug/skills-installer
  VERSION:
    sh: grep -m1 '^version' src-tauri/Cargo.toml | cut -d '"' -f2

includes:
  default:
    taskfile: .tasks/commands/default.yml
    flatten: true
  frontend-deps:
    taskfile: .tasks/commands/frontend-deps.yml
    flatten: true
  dev:
    taskfile: .tasks/commands/dev.yml
    flatten: true
  typecheck:
    taskfile: .tasks/commands/typecheck.yml
    flatten: true
  lint:
    taskfile: .tasks/commands/lint.yml
    flatten: true
  test:
    taskfile: .tasks/commands/test.yml
    flatten: true
  build:
    taskfile: .tasks/commands/build.yml
    flatten: true
  build_debug:
    taskfile: .tasks/commands/build/debug.yml
    flatten: true
  smoke:
    taskfile: .tasks/commands/smoke.yml
    flatten: true
  artifacts:
    taskfile: .tasks/commands/artifacts.yml
    flatten: true
  release:
    taskfile: .tasks/commands/release.yml
    flatten: true
  clean:
    taskfile: .tasks/commands/clean.yml
    flatten: true
  docker_release:
    taskfile: .tasks/commands/docker/release.yml
    flatten: true
