---
# https://taskfile.dev

version: '3'

output: interleaved

dotenv: ['.env', '{{.ENV}}/.env.', '{{.HOME}}/.env']

silent: true

tasks:
  default:
    cmds:
      - task --list --sort none

  hello:
    desc: Prints a greeting (example task, replace or remove).
    cmds:
      - echo "Hello from Task!"

  info:
    desc: Prints the current directory and date (example task, replace or remove).
    cmds:
      - pwd
      - date
