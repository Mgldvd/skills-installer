---
# https://taskfile.dev

version: "3"

output: interleaved

dotenv: [".env", "{{.ENV}}/.env.", "{{.HOME}}/.env"]

vars:
  FRONTEND_DIR: frontend
  TAURI_DIR: src-tauri
  TAURI_BIN: frontend/node_modules/.bin/tauri
  DIST_DIR: dist
  TEST_DIR: test
  CLI_BIN: src-tauri/target/debug/skills-installer
  VERSION:
    sh: grep -m1 '^version' src-tauri/Cargo.toml | cut -d '"' -f2

tasks:
  default:
    desc: List all available tasks.
    cmds:
      - task --list --sort none

  frontend-deps:
    desc: Install frontend dependencies (npm no-ops when already up to date).
    internal: true
    cmds:
      - npm install --prefix {{.FRONTEND_DIR}}

  dev:
    desc: Start the Tauri development app (hot-reloading Vue frontend + Rust backend).
    deps: [frontend-deps]
    cmds:
      - "{{.TAURI_BIN}} dev"

  typecheck:
    desc: Type-check both halves of the app without emitting anything.
    deps: [frontend-deps]
    cmds:
      - npm run typecheck --prefix {{.FRONTEND_DIR}}
      - cargo check --manifest-path {{.TAURI_DIR}}/Cargo.toml --all-targets

  lint:
    desc: Lint both halves of the app.
    deps: [frontend-deps]
    cmds:
      - npm run lint --prefix {{.FRONTEND_DIR}}
      - cargo fmt --manifest-path {{.TAURI_DIR}}/Cargo.toml -- --check
      - cargo clippy --manifest-path {{.TAURI_DIR}}/Cargo.toml --all-targets -- -D warnings

  test:
    desc: Run both test suites. No real network calls or installs happen here — Rust tests use FakeInstaller/FakeProcessRunner, Vue tests use jsdom.
    deps: [frontend-deps]
    cmds:
      - npm run test --prefix {{.FRONTEND_DIR}}
      - cargo test --manifest-path {{.TAURI_DIR}}/Cargo.toml

  build:
    desc: Build the release-grade raw executable and the configured bundles (AppImage + .deb, per src-tauri/tauri.conf.json's bundle.targets).
    deps: [frontend-deps]
    cmds:
      - "{{.TAURI_BIN}} build"

  build:debug:
    desc: Build a debug CLI binary (no frontend bundling, no AppImage/deb) for fast local install testing.
    cmds:
      - cargo build --manifest-path {{.TAURI_DIR}}/Cargo.toml --bin skills-installer

  smoke:
    desc: Wipe test/ and install 5 random enabled skills into it through the real CLI (no mocks) — quick end-to-end sanity check.
    deps: [build:debug]
    preconditions:
      - sh: command -v jq >/dev/null 2>&1
        msg: "jq no está instalado — necesario para elegir skills al azar del catálogo."
      - sh: command -v shuf >/dev/null 2>&1
        msg: "shuf no está instalado (coreutils) — necesario para elegir skills al azar."
    cmds:
      - |
        rm -rf {{.TEST_DIR}}
        mkdir -p {{.TEST_DIR}}
        cd {{.TEST_DIR}}
        ids=$(../{{.CLI_BIN}} list --json | jq -r '.[] | select(.enabled) | .id' | shuf -n 5)
        echo "Installing: $ids"
        ../{{.CLI_BIN}} install $ids --yes
        echo
        echo "Installed in {{.TEST_DIR}}/:"
        ../{{.CLI_BIN}} list --installed

  appimage:
    desc: Build and copy the AppImage into dist/ with the documented naming pattern.
    deps: [build]
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - |
        src=$(find {{.TAURI_DIR}}/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n1)
        if [ -z "$src" ]; then
          echo "No AppImage found under {{.TAURI_DIR}}/target/release/bundle/appimage" >&2
          exit 1
        fi
        cp "$src" "{{.DIST_DIR}}/Skills-Installer-{{.VERSION}}-x86_64.AppImage"
        echo "Copied $src -> {{.DIST_DIR}}/Skills-Installer-{{.VERSION}}-x86_64.AppImage"

  deb:
    desc: Build and copy the .deb into dist/ with the documented naming pattern.
    deps: [build]
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - |
        src=$(find {{.TAURI_DIR}}/target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -n1)
        if [ -z "$src" ]; then
          echo "No .deb found under {{.TAURI_DIR}}/target/release/bundle/deb" >&2
          exit 1
        fi
        cp "$src" "{{.DIST_DIR}}/skills-installer_{{.VERSION}}_amd64.deb"
        echo "Copied $src -> {{.DIST_DIR}}/skills-installer_{{.VERSION}}_amd64.deb"

  release:
    desc: Full verification pipeline (typecheck, lint, test) plus every Linux artifact, copied into dist/.
    cmds:
      - task: typecheck
      - task: lint
      - task: test
      - task: appimage
      - task: deb
      - cp {{.TAURI_DIR}}/target/release/skills-installer {{.DIST_DIR}}/skills-installer
      - echo "Release artifacts:"
      - ls -la {{.DIST_DIR}}/

  clean:
    desc: Remove build artifacts (src-tauri/target, frontend/dist, dist). Destructive — do not run without authorization.
    cmds:
      - rm -rf {{.TAURI_DIR}}/target {{.FRONTEND_DIR}}/dist {{.DIST_DIR}}

  docker:release:
    desc: Run the full release pipeline inside Docker, matching CI exactly (replaces the old ./dist.sh).
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: "Docker no está instalado o no está disponible en PATH."
      - sh: docker compose version >/dev/null 2>&1
        msg: "Se requiere Docker Compose v2 (comando: docker compose)."
      - sh: docker info >/dev/null 2>&1
        msg: "El daemon de Docker no está activo o el usuario no tiene acceso."
    vars:
      HOST_UID:
        sh: id -u
      HOST_GID:
        sh: id -g
    env:
      HOST_UID: "{{.HOST_UID}}"
      HOST_GID: "{{.HOST_GID}}"
    cmds:
      # Pre-create every path a named volume mounts *under* the bind-mounted
      # repo (see compose.yml). Docker itself — not the container's process —
      # creates a missing mount-point directory on the host when a container
      # starts, and it does so as whichever user runs the Docker daemon
      # (root, on a typical Linux install), regardless of which user runs
      # inside the container. Creating them here first, as the normal host
      # user, means Docker never has to.
      - mkdir -p {{.FRONTEND_DIR}}/node_modules {{.TAURI_DIR}}/target {{.DIST_DIR}}
      - docker compose build dist
      - docker compose run --rm --no-deps dist
      - echo
      - echo "Artifacts generados en {{.ROOT_DIR}}/{{.DIST_DIR}}"
      - ls -lah {{.DIST_DIR}}
